basePath: /campaign-center-api/v1
definitions:
  data.BudgetVO:
    properties:
      projectId:
        type: integer
      projectName:
        type: string
    type: object
  data.CampaignListVO:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
      updatedAt:
        type: integer
      version:
        type: integer
    type: object
  data.CampaignRewardRuleVO:
    properties:
      campaignId:
        type: integer
      id:
        type: integer
      taskGroupId:
        type: integer
      taskGroupReward:
        type: integer
      taskRewardItems:
        items:
          $ref: '#/definitions/data.TaskRewardItemVO'
        type: array
    type: object
  data.CampaignVO:
    properties:
      budgets:
        $ref: '#/definitions/data.BudgetVO'
      campaignEndTime:
        type: integer
      campaignStartTime:
        type: integer
      createdAt:
        type: integer
      id:
        type: integer
      landingPageId:
        type: integer
      market:
        type: string
      name:
        type: string
      registrationEndTime:
        type: integer
      registrationStartTime:
        type: integer
      rewardRules:
        $ref: '#/definitions/data.CampaignRewardRuleVO'
      status:
        type: integer
      targetUserGroups:
        $ref: '#/definitions/data.TargetUserGroupVO'
      timeZone:
        type: string
      updatedAt:
        type: integer
      version:
        type: integer
    type: object
  data.CreateCampaignReq:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  data.GenerateLandingTranslationData:
    properties:
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      lang:
        example: ja
        type: string
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
    type: object
  data.GenerateLandingTranslationReq:
    properties:
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      sourceLang:
        example: en
        type: string
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      targetLang:
        example: ja
        type: string
      terms:
        type: string
      title:
        type: string
    required:
    - sourceLang
    - targetLang
    type: object
  data.ImageUploadData:
    properties:
      url:
        type: string
    type: object
  data.LandingPageBody:
    properties:
      bannerImageUrl:
        type: string
      defaultLang:
        type: string
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
    required:
    - bannerImageUrl
    - defaultLang
    - description
    - terms
    - title
    type: object
  data.LandingPageCreateResp:
    properties:
      bannerImageUrl:
        type: string
      defaultLang:
        type: string
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      landingPageId:
        type: integer
      status:
        type: integer
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
    type: object
  data.LandingPageDetailVO:
    properties:
      bannerImageUrl:
        type: string
      createdAt:
        type: string
      defaultLang:
        type: string
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      id:
        type: integer
      lang:
        type: string
      status:
        type: integer
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  data.LandingPageListData:
    properties:
      items:
        items:
          $ref: '#/definitions/data.LandingPageListItemVO'
        type: array
      total:
        type: integer
    type: object
  data.LandingPageListItemVO:
    properties:
      createdAt:
        type: string
      defaultLang:
        type: string
      id:
        type: integer
      status:
        type: integer
      title:
        type: string
    type: object
  data.LandingPagePublishResp:
    properties:
      landingPageId:
        type: integer
      status:
        type: integer
    type: object
  data.LandingPageRepeatableItemVO:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  data.LandingPageTranslatedLangsData:
    properties:
      langs:
        items:
          type: string
        type: array
    type: object
  data.LandingPageUpdateResp:
    properties:
      bannerImageUrl:
        type: string
      defaultLang:
        type: string
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      landingPageId:
        type: integer
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
    type: object
  data.PublishOperatorReq:
    properties:
      operator:
        type: string
    required:
    - operator
    type: object
  data.PutLandingTranslationData:
    properties:
      landingPageId:
        type: integer
      lang:
        type: string
    type: object
  data.PutLandingTranslationReq:
    properties:
      description:
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      operator:
        example: admin
        type: string
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        type: string
      title:
        type: string
    required:
    - description
    - terms
    - title
    type: object
  data.StandardResponse:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  data.TargetUserGroupVO:
    properties:
      groupName:
        type: string
      id:
        type: integer
    type: object
  data.TaskRewardItemVO:
    properties:
      rewardTemplateId:
        type: integer
      rewardTemplateName:
        type: string
      taskId:
        type: integer
      taskName:
        type: string
    type: object
  data.WebCampaignLandingPageData:
    properties:
      campaignId:
        example: 1001
        type: integer
      joined:
        example: false
        type: boolean
      joinedAt:
        example: 1717200000
        type: integer
      landingPage:
        $ref: '#/definitions/data.WebLandingPageContent'
      market:
        example: SG
        type: string
      name:
        example: Summer Deposit Bonus
        type: string
      timeZone:
        example: Asia/Singapore
        type: string
      userId:
        example: 42
        type: integer
    type: object
  data.WebCampaignListData:
    properties:
      ongoing:
        items:
          $ref: '#/definitions/data.WebCampaignListItem'
        type: array
      upcoming:
        items:
          $ref: '#/definitions/data.WebCampaignListItem'
        type: array
    type: object
  data.WebCampaignListItem:
    properties:
      campaignEndTime:
        example: 1722470400
        type: integer
      campaignStartTime:
        example: 1717200000
        type: integer
      id:
        example: 1001
        type: integer
      joined:
        example: false
        type: boolean
      landingPageId:
        example: 2001
        type: integer
      market:
        example: SG
        type: string
      status:
        example: 2
        type: integer
      title:
        example: Deposit and get a bonus
        type: string
    type: object
  data.WebJoinCampaignData:
    properties:
      campaignId:
        example: 1001
        type: integer
      joined:
        example: true
        type: boolean
      joinedAt:
        example: 1717200000
        type: integer
      message:
        example: joined
        type: string
      userId:
        example: 42
        type: integer
    type: object
  data.WebLandingPageContent:
    properties:
      bannerImageUrl:
        example: https://cdn.example.com/banner.png
        type: string
      description:
        example: Join the campaign and complete the deposit task.
        type: string
      faq:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      lang:
        example: en
        type: string
      steps:
        items:
          $ref: '#/definitions/data.LandingPageRepeatableItemVO'
        type: array
      terms:
        example: One reward per user.
        type: string
      title:
        example: Deposit and get a bonus
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
  description: HTTP API for campaign center (admin campaign/landing-page + user campaign
    mocks). Operates under `/campaign-center-api/v1`;
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Campaign Center API
  version: "1.0"
paths:
  /admin/campaigns:
    get:
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10)
        in: query
        name: pageSize
        type: integer
      - description: Campaign status filter
        in: query
        name: status
        type: integer
      - description: Campaign ID filter
        in: query
        name: campaignId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  properties:
                    items:
                      items:
                        $ref: '#/definitions/data.CampaignListVO'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: List campaigns (admin)
      tags:
      - admin-campaign
    post:
      consumes:
      - application/json
      parameters:
      - description: Campaign name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CreateCampaignReq'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  properties:
                    campaignId:
                      type: integer
                  type: object
              type: object
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Create campaign (admin)
      tags:
      - admin-campaign
  /admin/campaigns/{campaignId}:
    get:
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.CampaignVO'
              type: object
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Get campaign detail (admin)
      tags:
      - admin-campaign
  /admin/campaigns/{campaignId}/participations:
    get:
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Filter by user ID
        in: query
        name: userId
        type: integer
      - description: Filter by reward status e.g. GRANTED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: List campaign participations (admin, mock)
      tags:
      - admin-campaign-performance
  /admin/campaigns/{campaignId}/performance/daily:
    get:
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      - description: Start date YYYY-MM-DD
        in: query
        name: startDate
        required: true
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: List campaign daily performance (admin, mock)
      tags:
      - admin-campaign-performance
  /admin/campaigns/{campaignId}/performance/summary:
    get:
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Get campaign performance summary (admin, mock)
      tags:
      - admin-campaign-performance
  /admin/campaigns/{campaignId}/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      - description: Operator
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.PublishOperatorReq'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.CampaignVO'
              type: object
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Publish campaign (admin)
      tags:
      - admin-campaign
  /admin/campaigns/{campaignId}/versions:
    post:
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success; returns existing draft version when latest is still
            draft
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  properties:
                    campaignId:
                      type: integer
                    version:
                      type: integer
                  type: object
              type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Create campaign version (admin)
      tags:
      - admin-campaign
  /admin/campaigns/{campaignId}/versions/{version}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Campaign ID
        in: path
        name: campaignId
        required: true
        type: integer
      - description: Version
        in: path
        name: version
        required: true
        type: integer
      - description: Draft content; read-only fields are ignored
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CampaignVO'
      produces:
      - application/json
      responses:
        "200":
          description: updated campaign draft
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.CampaignVO'
              type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "409":
          description: not editable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Edit campaign draft version (admin)
      tags:
      - admin-campaign
  /admin/images/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Image file (jpg/png/webp/gif, max 5MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.ImageUploadData'
              type: object
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: oss not configured
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Upload image (admin)
      tags:
      - admin-images
  /admin/landing-pages:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      - description: Status filter
        in: query
        name: status
        type: integer
      - description: Default language filter e.g. en
        in: query
        name: defaultLang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageListData'
              type: object
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: List landing pages (admin)
      tags:
      - admin-landing-page
    post:
      consumes:
      - application/json
      parameters:
      - description: Landing page content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.LandingPageBody'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageCreateResp'
              type: object
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Create landing page (admin)
      tags:
      - admin-landing-page
  /admin/landing-pages/{landingPageId}:
    get:
      parameters:
      - description: Landing page ID
        in: path
        name: landingPageId
        required: true
        type: integer
      - description: Requested language (falls back to default)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageDetailVO'
              type: object
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Get landing page (admin)
      tags:
      - admin-landing-page
    put:
      consumes:
      - application/json
      parameters:
      - description: Landing page ID
        in: path
        name: landingPageId
        required: true
        type: integer
      - description: Landing page content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.LandingPageBody'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageUpdateResp'
              type: object
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "409":
          description: not draft
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Update landing page (admin)
      tags:
      - admin-landing-page
  /admin/landing-pages/{landingPageId}/detail/{lang}:
    get:
      parameters:
      - description: Landing page ID
        in: path
        name: landingPageId
        required: true
        type: integer
      - description: Locale tag, e.g. ja, zh-CN
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageDetailVO'
              type: object
        "400":
          description: invalid path
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Get landing page detail by locale (admin)
      tags:
      - admin-landing-page
  /admin/landing-pages/{landingPageId}/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: Landing page ID
        in: path
        name: landingPageId
        required: true
        type: integer
      - description: Operator
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.PublishOperatorReq'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPagePublishResp'
              type: object
        "404":
          description: not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
          schema:
            $ref: '#/definitions/data.StandardResponse'
      summary: Publish landing page (admin)
      tags:
      - admin-landing-page
  /admin/landing-pages/{landingPageId}/translations:
    get:
      parameters:
      - description: Landing page ID
        in: path
        name: landingPageId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/data.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LandingPageTranslatedLangsData'
              type: object
        "400":
          description: invalid path
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "404":
          description: landing page not found
          schema:
            $ref: '#/definitions/data.StandardResponse'
        "503":
          description: database unavailable
