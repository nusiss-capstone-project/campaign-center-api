http:
  host: 0.0.0.0
  port: 8080
log:
  level: info
grpc:
  host: 0.0.0.0
  port: 5000
  connect_timeout: 5
  max_pool_size: 100
redis:
  enabled: false
  host: 127.0.0.1
  port: "6379"
# OpenAI: API key from env OPENAI_API_KEY only.
openai:
  base_url: ""
  model: "gpt-4o-mini"

# Aliyun OSS: AK/SK from env OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET only.
oss:
  endpoint: oss-ap-southeast-1.aliyuncs.com
  bucket: campaign-center-img
  public_base_url: "https://cdn.campaignhub.best"
  key_prefix: campaign-center

usergroup_grpc:
  host: 127.0.0.1
  port: 50051
task_grpc:
  host: 127.0.0.1
  port: 50052
reward_grpc:
  host: 127.0.0.1
  port: 50053

kafka:
  enabled: false
  brokers:
    - localhost:9092
  group_id: campaign-center-api
  client_id: campaign-center-api
  topics:
    - task.events.completed
    - reward.distribution.result

system:
  allowed_origins: 
  - https://campaign-center-admin-web.vercel.app
  - https://finverse-web.vercel.app
  - http://localhost:3000
